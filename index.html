<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>harvest da Quote</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sickle" id="sickle"></div>

    <img src="images/bg for grup project.png" alt="" class="bg-img">

    <div class="wlc-div wlc-hidden" id="wlc-div">
        <div class="wlc-content">
            <h1 class="wlc-text ani text1">Hiiiiiiiii!</h1>
            <h1 class="wlc-text ani text2">How are you??</h1>
            <h1 class="wlc-text ani text3">How's the harvest going?? :p</h1>
            <h1 class="wlc-text ani text4">Would you mind trying this out for a moment?</h1>

            <button id="wlc-btn" class="wlc-btn ani">Get Started</button>
        </div>
    </div>

    <header class="top">
        <h1 class="head">
            harvest da Quote
        </h1>
        <p class="quote1"> 
            always remember "today's work, tommorow's fruit"
        </p>
    </header>



    <main>
        <section class="todooo" id="harvest">
            <img src="images/pixeled-bg.png" alt="" class="bg-img-for">
            <div class="hud" id="hud">🌾 0 / 5</div>
            <div class="field" id="field"></div>
        </section>
    </main>

    <div class="quote-card" id="quote-card" hidden>
        <p id="quote-text"></p>
        <button class="wlc-btn" id="quote-close">Keep harvesting</button>
    </div>

    <script src="script/app.js"></script>
    <script src="script/load.js"></script>
</body>
</html>
